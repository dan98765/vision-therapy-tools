<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Hart Chart Generator</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <a class="back" href="../">&larr; All exercises</a>
  <h1>Hart Chart Generator</h1>
  <p class="subtitle">Rows of random letters for saccade and near-far focusing practice</p>

  <!-- Controls Panel -->
  <div class="controls-panel">
    <h2>Chart Settings</h2>
    <div class="controls-grid">

      <div class="control-group">
        <label for="rows">Rows</label>
        <div class="control-row">
          <input type="range" id="rows" min="4" max="24" value="12" step="1">
          <span class="value-display" id="rows-val">12</span>
        </div>
      </div>

      <div class="control-group">
        <label for="cols">Letters per Row</label>
        <div class="control-row">
          <input type="range" id="cols" min="4" max="16" value="10" step="1">
          <span class="value-display" id="cols-val">10</span>
        </div>
      </div>

      <div class="control-group">
        <label for="letter-height">Letter Height</label>
        <div class="control-row">
          <input type="range" id="letter-height" min="2" max="30" value="5" step="0.5">
          <span class="value-display" id="letter-height-val">5.0 mm</span>
        </div>
      </div>

      <div class="control-group">
        <label for="spacing">Spacing</label>
        <div class="control-row">
          <input type="range" id="spacing" min="1.5" max="4" value="2.5" step="0.1">
          <span class="value-display" id="spacing-val">2.5×</span>
        </div>
      </div>

      <div class="control-group">
        <label for="letter-set">Letter Set</label>
        <div class="control-row">
          <select id="letter-set">
            <option value="upper">Uppercase A – Z</option>
            <option value="upper-consonants">Uppercase consonants only</option>
            <option value="lower">Lowercase a – z</option>
            <option value="lower-consonants">Lowercase consonants only</option>
          </select>
        </div>
      </div>

      <div class="control-group">
        <label class="checkbox-label">
          <input type="checkbox" id="show-numbers">
          Show row numbers
        </label>
      </div>

    </div>
  </div>

  <!-- Action Buttons -->
  <div class="actions">
    <button type="button" class="btn btn-primary" id="btn-generate">Generate Chart</button>
    <button type="button" class="btn btn-secondary" id="btn-print">Print Chart</button>
  </div>

  <p class="note" id="chart-note" aria-live="polite"></p>

  <!-- Chart -->
  <div class="chart-wrapper">
    <div class="chart" id="chart" role="img" aria-label="Hart chart of random letters"></div>
  </div>

  <p class="disclaimer">Not medical advice. Use exercises as directed by your vision therapist.</p>
</body>
</html>
