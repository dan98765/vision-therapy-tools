<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Macdonald Form Field Cards</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <a class="back" href="../">&larr; All exercises</a>
  <h1>Macdonald Form Field Cards</h1>
  <p class="subtitle">Vision therapy form recognition field cards</p>

  <!-- Controls Panel -->
  <div class="controls-panel">
    <h2>Card Settings</h2>
    <div class="controls-grid">

      <div class="control-group">
        <label for="rings">Number of Rings</label>
        <div class="control-row">
          <input type="range" id="rings" min="3" max="7" value="5" step="1">
          <span class="value-display" id="rings-val">5</span>
        </div>
      </div>

      <div class="control-group">
        <label for="letters-per-ring">Letters per Ring</label>
        <div class="control-row">
          <input type="range" id="letters-per-ring" min="3" max="10" value="6" step="1">
          <span class="value-display" id="letters-per-ring-val">6</span>
        </div>
      </div>

      <div class="control-group">
        <label for="card-size">Card Size (long side)</label>
        <div class="control-row">
          <input type="range" id="card-size" min="100" max="250" value="216" step="1">
          <span class="value-display" id="card-size-val">216 mm</span>
        </div>
      </div>

      <div class="control-group">
        <label for="aspect-ratio">Aspect Ratio</label>
        <div class="control-row">
          <select id="aspect-ratio">
            <option value="0.647">5.5 : 8.5 (Letter card)</option>
            <option value="0.75">3 : 4 (Portrait)</option>
            <option value="1">1 : 1 (Square)</option>
            <option value="1.333">4 : 3 (Landscape)</option>
            <option value="1.545">8.5 : 5.5 (Landscape card)</option>
          </select>
        </div>
      </div>

      <div class="control-group">
        <label for="base-letter">Base Letter Height</label>
        <div class="control-row">
          <input type="range" id="base-letter" min="1" max="6" value="2" step="0.5">
          <span class="value-display" id="base-letter-val">2.0 mm</span>
        </div>
      </div>

      <div class="control-group">
        <label for="scale-factor">Scale Factor</label>
        <div class="control-row">
          <input type="range" id="scale-factor" min="1.3" max="2.5" value="1.6" step="0.05">
          <span class="value-display" id="scale-factor-val">1.60</span>
        </div>
      </div>

      <div class="control-group">
        <label for="letter-set">Letter Set</label>
        <div class="control-row">
          <select id="letter-set">
            <option value="all">A – Z (All letters)</option>
            <option value="consonants">Consonants only</option>
            <option value="vowels">Vowels only</option>
          </select>
        </div>
      </div>

      <div class="control-group">
        <label class="checkbox-label">
          <input type="checkbox" id="show-dot" checked>
          Show center fixation dot
        </label>
      </div>

    </div>
  </div>

  <!-- Action Buttons -->
  <div class="actions">
    <button type="button" class="btn btn-primary" id="btn-generate">Generate Card</button>
    <button type="button" class="btn btn-secondary" id="btn-print">Print Card</button>
  </div>

  <p class="note" id="card-note" aria-live="polite"></p>

  <!-- Card -->
  <div class="card-wrapper">
    <div class="card" id="card"></div>
  </div>

  <p class="disclaimer">Not medical advice. Use exercises as directed by your vision therapist.</p>
</body>
</html>
