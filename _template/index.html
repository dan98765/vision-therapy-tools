<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Exercise Name</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <a class="back" href="../">&larr; All exercises</a>
  <h1>Exercise Name</h1>
  <p class="subtitle">One-line description of what this exercise is for.</p>

  <div class="controls-panel">
    <h2>Settings</h2>
    <div class="controls-grid">

      <div class="control-group">
        <label for="size">Size</label>
        <div class="control-row">
          <input type="range" id="size" min="1" max="10" value="5" step="1">
          <span class="value-display" id="size-val">5</span>
        </div>
      </div>

    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-primary" id="btn-generate">Generate</button>
    <button type="button" class="btn btn-secondary" id="btn-print">Print</button>
  </div>

  <p class="note" id="exercise-note" aria-live="polite"></p>

  <main id="exercise"></main>

  <p class="disclaimer">Not medical advice. Use exercises as directed by your vision therapist.</p>
</body>
</html>
