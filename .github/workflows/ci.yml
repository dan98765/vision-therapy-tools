name: CI

# Runs lint, the tests and a build on pull requests (including Dependabot's), so a
# change is checked before it is merged. Nothing is deployed from here;
# pages.yml deploys after a merge to main.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # package.json "engines" is ^22.22.0 || >=24.8.0, so test both minimums and current 24
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.0', '24.8.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
