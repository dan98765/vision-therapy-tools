name: CI

# Runs the tests and a build on pull requests (including Dependabot's), so a
# change is checked before it is merged. Nothing is deployed from here;
# pages.yml deploys after a merge to main.

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
